# llama-swap config TEMPLATE for the Linux/Omarchy engine (AMD Strix Halo).
# This is a GENERATED-TEMPLATE source: the literal tokens __ENGINE_DIR__ and
# __MODELS_DIR__ are replaced with absolute paths (forward slashes) by
# scripts/setup-engine.sh, which installs the result to
# $ENGINE_DIR/llama-swap.yaml. Ported 2026-11-14 from the Windows engine
# config (engine/llama-swap.yaml on the 4090 box).
#
# One stable OpenAI endpoint, hot-swaps GGUFs on demand. Each model loads on
# first request and unloads after `ttl` idle seconds, so only one big model
# occupies the GPU at a time.
#
# Serving surfaces per model type:
#   text   -> llama-server (OpenAI chat)
#   image  -> sd-server: /v1/images/generations + /v1/images/edits (multipart,
#             routed by the form's model field)
#   video  -> sd-server: async /sdcpp/v1/vid_gen + /sdcpp/v1/jobs/{id}, reached
#             via llama-swap's /upstream/<alias>/ passthrough (Aegis /video)
#
# Strix Halo notes: the Radeon 8060S draws from 128GB of unified LPDDR5X, so
# the 24GB-VRAM spill tunings the Windows config carried (partial offload and
# expert-in-RAM flags) are gone -- every GPU-group entry runs full offload.
# The 50GB+ models additionally need the GTT kernel tuning from the docs
# (ttm pages_limit / page_pool_size) before they can load. If the engine was
# built with --backend rocm, add --no-mmap to the llama-server entries (ROCm
# >64GB mmap bug); the default Vulkan build needs no change.
healthCheckTimeout: 300
logLevel: info

models:
  # 32K context: agentic coding + tool schemas easily exceed 8K (that's the
  # "request exceeds available context size" 400). At Q4 the 17GB weights + a
  # 32K KV cache (~3GB with flash attn) are a light load for unified memory.
  # Native ceiling is 256K -- raise -c further (add --cache-type-k/v q8_0 to
  # halve KV memory) if you need it, watching GTT headroom.
  "qwen3-coder-30b":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Qwen3-Coder-30B-A3B-Instruct-Q4_0.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 45056 -fa on --jinja --no-webui
    ttl: 600

  # Uncensored Gemma finetune (16GB Q4). Full GPU offload; gemma KV is huge
  # (~469MB/1k tokens) so the proven 8K context is kept -- raise -c if you
  # need more, unified memory has the room.
  "supergemma4-26b":
