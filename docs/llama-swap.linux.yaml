  # LOCAL IMAGE GENERATION -- Qwen-Image (diffusion) under stable-diffusion.cpp's
  # sd-server, which speaks OpenAI's /v1/images/generations. Text encoder runs on
  # CPU (one pass per prompt) so the 20.7GB Q8 diffusion model stays resident on
  # the GPU. (The Windows 4090 did ~25s per 512x512 image; expect slower on the
  # 8060S iGPU.) sd-server has no /health route, so health-check /v1/models
  # instead.
  "qwen-image":
    cmd: |
      "__ENGINE_DIR__/sdcpp/sd-server"
      --diffusion-model "__MODELS_DIR__/qwen-image/qwen-image-2512-Q8_0.gguf"
      --llm "__MODELS_DIR__/qwen-image/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf"
      --vae "__MODELS_DIR__/qwen-image/qwen_image_vae.safetensors"
      --backend clip=cpu
      --diffusion-fa --vae-tiling
      --lora-model-dir "__MODELS_DIR__/loras"
      --listen-port ${PORT}
    checkEndpoint: /v1/models
    ttl: 300

  # IMAGE EDITING -- Qwen-Image-Edit 2511 (img2img / inpaint / instruction edit)
  # under sd-server's /v1/images/edits. Reuses the SAME VAE + Qwen2.5-VL text
  # encoder as qwen-image. qwen_image_zero_cond_t=true is REQUIRED for the 2511
  # checkpoint (edit quality collapses without it, per sd.cpp docs).
  "qwen-image-edit":
    cmd: |
      "__ENGINE_DIR__/sdcpp/sd-server"
      --diffusion-model "__MODELS_DIR__/qwen-image-edit-2511-Q8_0.gguf"
      --llm "__MODELS_DIR__/qwen-image/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf"
      --vae "__MODELS_DIR__/qwen-image/qwen_image_vae.safetensors"
      --model-args qwen_image_zero_cond_t=true
      --cfg-scale 2.5 --flow-shift 3
      --backend clip=cpu
      --offload-to-cpu
      --diffusion-fa --vae-tiling
      --lora-model-dir "__MODELS_DIR__/loras"
      --listen-port ${PORT}
    checkEndpoint: /v1/models
    # Edits render slower than plain generation; keep a longer idle window so
    # the TTL can never fire while a legitimate render is still in flight.
    ttl: 600

  # Uncensored Qwen-Image merge (Phr00t Rapid, 21.75GB Q8) -- same qwen_image
  # architecture, reuses the stock VAE + Qwen2.5-VL text encoder. Rapid merges
  # are step-distilled: server defaults set to 8 steps / CFG 1.0.
  "qwen-image-rapid-nsfw":
    cmd: |
      "__ENGINE_DIR__/sdcpp/sd-server"
