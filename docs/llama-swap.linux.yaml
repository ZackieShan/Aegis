# llama-swap config TEMPLATE for the Linux/Omarchy engine (AMD Strix Halo).
# This is a GENERATED-TEMPLATE source: the literal tokens __ENGINE_DIR__ and
# __MODELS_DIR__ are replaced with absolute paths (forward slashes) by
# scripts/setup-engine.sh, which installs the result to
# $ENGINE_DIR/llama-swap.yaml. Ported 2026-11-14 from the Windows engine
# config (engine/llama-swap.yaml on the 4090 box).
# 2026-11-22 model refresh: aliases whose files are gone were removed and the
# five 60-85GB MoE chat models added. Keep it that way -- every alias must
# name files that exist, or llama-swap answers a request with a load failure.
#
# One stable OpenAI endpoint, hot-swaps GGUFs on demand. Each model loads on
# first request and unloads after `ttl` idle seconds, so only one big model
# occupies the GPU at a time.
#
# Serving surfaces per model type:
#   text   -> llama-server (OpenAI chat)
#   image  -> sd-server: /v1/images/generations + /v1/images/edits (multipart,
#             routed by the form's model field)
#   video  -> sd-server: async /sdcpp/v1/vid_gen + /sdcpp/v1/jobs/{id}, reached
#             via llama-swap's /upstream/<alias>/ passthrough (Aegis /video)
#
# Strix Halo notes: the Radeon 8060S draws from 128GB of unified LPDDR5X, so
# the 24GB-VRAM spill tunings the Windows config carried (partial offload and
# expert-in-RAM flags) are gone -- every GPU-group entry runs full offload.
# The 50GB+ models additionally need the GTT kernel tuning from the docs
# (ttm pages_limit / page_pool_size) before they can load. If the engine was
# built with --backend rocm, add --no-mmap to the llama-server entries (ROCm
# >64GB mmap bug); the default Vulkan build needs no change.
healthCheckTimeout: 300
logLevel: info
# Variant ids created by a model's filters.setParamsByID (gpt-oss-120b-fast)
# appear in /v1/models, so Aegis can pick them like any other model.
includeAliasesInList: true

# The main chat model is loaded as soon as llama-swap starts, so the first
# message after a boot or an Aegis restart does not wait for 63GB to load.
hooks:
  on_startup:
    preload:
      - "gpt-oss-120b"

models:
  # Uncensored Gemma finetune (16GB Q4). Full GPU offload; gemma KV is huge
  # (~469MB/1k tokens) so the proven 8K context is kept -- raise -c if you
  # need more, unified memory has the room.
  "supergemma4-26b":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/supergemma4-26b-uncensored-fast-v2-Q4_K_M.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 8192 -fa on --jinja --no-webui
    ttl: 600

  # Uncensored 4B at BF16 (8.4GB) -- small enough to sit fully on the GPU with
  # a large context. Fast daily driver for unfiltered offline work.
  "qwen3.5-4b-uncensored":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive-BF16.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 32768 -fa on --jinja --no-webui
    ttl: 600

  # 35B MoE, A3B (only ~3B params active per token). The 36.9GB Q8 sits fully
  # GPU-resident in unified memory.
  # enable_thinking:false is REQUIRED on every Qwen3.6 (the template hard-starts
  # reasoning; without it the model's chain-of-thought streams out as the visible
  # reply). --dry-multiplier is the DRY anti-repetition sampler -- this MoE at Q8
  # can fall into verbatim "Okay. I'm ready." loops in long chats without it.
  # --cpu-moe removed: unified memory, fully GPU-resident on Strix Halo
  "qwen3.6-35b-a3b":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Qwen3.6-35B-A3B-Q8_0.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 65536 -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
      --chat-template-kwargs "{\"enable_thinking\":false}"
      --dry-multiplier 0.8
      --jinja --no-webui
    ttl: 600

  # Claude-4.5-Opus-distilled GLM-4.7-Flash (deepseek2 arch) at Q4_K_M (18.1GB,
  # TeichAI official quant). The bf16 sibling was removed in the 2026-11
  # model refresh. MLA keeps KV tiny at 65K ctx.
  "glm-4.7-flash-q4":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/glm-4.7-flash-claude-4.5-opus.q4_k_m.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 65536 -fa on
      --jinja --no-webui
    ttl: 600

  # DavidAU uncensored GLM-4.7-Flash (Heretic NEO-CODE imatrix, 18.5GB Q4) --
  # same deepseek2 arch, fully GPU-resident. The uncensored counterpart to
  # the Opus distill above.
  "glm-4.7-flash-uncensored":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/GLM-4.7-Flash-Uncen-Hrt-NEO-CODE-MAX-imat-D_AU-Q4_K_M.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 65536 -fa on
      --jinja --no-webui
    ttl: 600

  # Kimi-Linear-48B-A3B-Instruct (bartowski Q4_K_M 30.1GB) -- Moonshot's
  # linear-attention MoE; KV stays cheap even at huge contexts, so this is
  # the long-document/research pick.
  # --cpu-moe removed: unified memory, fully GPU-resident on Strix Halo
  "kimi-linear-48b":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/moonshotai_Kimi-Linear-48B-A3B-Instruct-Q4_K_M.gguf"
