  # Qwen3-Coder-Next 80B-A3B (unsloth UD-Q4_K_XL 49.6GB) -- current-gen big
  # coder, the heavyweight upgrade over qwen3-coder-30b for agentic coding.
  # Hybrid-linear attention keeps KV modest. Needs the GTT kernel tuning from
  # the docs before the weights can load fully GPU-resident.
  # --cpu-moe removed: unified memory, fully GPU-resident on Strix Halo
  "qwen3-coder-next-80b":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Qwen3-Coder-Next-UD-Q4_K_XL.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 65536 -fa on
      --jinja --no-webui
    ttl: 600

  # THE BIG ONE -- Qwopus3.5 122B-A10B (75.8GB Q4_K_M): Kimi-K2.6 distill with
  # healed abliteration (post-abliteration retraining recovers the quality raw
  # abliteration costs). Largest uncensored model this box can serve; the
  # 75.8GB of weights need the GTT kernel tuning from the docs. Do not expect
  # GLM speeds -- A10B active params move per token on the iGPU.
  # --cpu-moe removed: unified memory, fully GPU-resident on Strix Halo
  "qwopus-122b-uncensored":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Qwopus3.5-122B-A10B-Kimi-K2.6-destill-healed-abliterated-Q4_K_M.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 32768 -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
      --chat-template-kwargs "{\"enable_thinking\":false}"
      --jinja --no-webui
    ttl: 600

  # DavidAU Qwen3.6-40B "Deckard" (28.2GB Q5_K_M) -- Claude 4.6 Opus THINKING
  # flavor, heretic-uncensored, MoE upscale of the 35B-A3B family. Thinking is
  # left ON (it is the point of this model); --jinja parses it into
  # reasoning_content (verified). The Windows config carried a 24GB-4090
  # partial-offload sweep for this entry; that spill choreography is moot on
  # unified memory -- full offload. Vision variant below.
  # --cpu-moe removed: unified memory, fully GPU-resident on Strix Halo
  "qwen3.6-40b-deckard":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Qwen3.6-40B-Deck-Opus-NEO-CODE-HERE-2T-OT-Q5_K_M.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 16384 -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
      --dry-multiplier 0.8
      --jinja --no-webui
    ttl: 600

  # Vision-enabled Deckard: same weights + the F32 mmproj, context kept at the
  # proven 8K to leave headroom for projector + image-encode buffers. Use this
  # one only when a chat actually includes images.
  # --cpu-moe removed: unified memory, fully GPU-resident on Strix Halo
  "qwen3.6-40b-deckard-vision":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Qwen3.6-40B-Deck-Opus-NEO-CODE-HERE-2T-OT-Q5_K_M.gguf"
      --mmproj "__MODELS_DIR__/mmproj-Qwen3.6-40B-Deckard-F32.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 8192 -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
      --dry-multiplier 0.8
      --jinja --no-webui
    ttl: 600

  # Huihui abliterated 35B-A3B on the Claude 4.7 Opus distill base (25.3GB
  # Q5_K) -- direct upgrade over the HauhauCS 35B uncensored: newer base, one
  # quant tier up.
  # --cpu-moe removed: unified memory, fully GPU-resident on Strix Halo
  "huihui-35b-opus-abliterated":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-Q5_K.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 65536 -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
      --chat-template-kwargs "{\"enable_thinking\":false}"
      --dry-multiplier 0.8
      --jinja --no-webui
    ttl: 600

  # DavidAU Fable-Fus 27B merge at Q5_K_M (19.3GB) -- full offload with a q8
  # KV cache at 8K. (The Windows note about dropping to partial offload on
  # VRAM spill does not apply on unified memory.)
  "qwen3.6-27b-fable-fus":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Qwen3.6-27B-Fable-Fus-711-UnHeretic-NM-DAU-NEO-MAX-NEO-Q5_K_M.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 8192 -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
      --chat-template-kwargs "{\"enable_thinking\":false}"
      --jinja --no-webui
    ttl: 600

  # Same uncensored 35B MoE at Q8_K_P (40.6GB) -- near-lossless quant; pick
  # this one when answer quality matters more than speed.
  # --cpu-moe removed: unified memory, fully GPU-resident on Strix Halo
  "qwen3.6-35b-a3b-uncensored-q8":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q8_K_P.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 65536 -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
      --chat-template-kwargs "{\"enable_thinking\":false}"
      --dry-multiplier 0.8
      --jinja --no-webui
    ttl: 600

  # ---- 2026-11 model refresh: the five big MoE chat models ----------------
  # All five are 60-85GB of weights and only load because of the 120GiB GTT
  # tuning (ttm pages_limit). Context starts at 32K: MoE generation speed
  # drops with context depth, so raise -c per model only after testing.

  # gpt-oss-120b Heretic (117B-A5B, MXFP4 63GB) -- OpenAI's open-weight
  # reasoning model, decensored. THE MAIN CHAT MODEL since 2026-11-22: the
  # fastest of the big models here (51 tok/s; 47 at 8K, 40 at 30K of context)
  # and it answered all 19 commonly-refused test questions directly.
  # Harmony-format reasoning is parsed by --jinja into reasoning_content.
  # 64K context: agent mode sends thousands of tokens of tool schemas before
  # the first user word (KV is ~70MB per 1K tokens, so ~4.6GB when full).
  # ttl 3600, not 600: reloading 63GB costs 15-25s, and nothing is lost by
  # staying warm -- another GPU model or a media job still evicts it at once.
  #
  # "gpt-oss-120b-fast" is the SAME loaded process with reasoning effort
  # "low": Aegis's utility role (titles, summaries, memory extraction) uses
  # it, so background calls neither swap models nor spend their small token
  # budgets on analysis. Reasoning effort for normal chat stays at the
  # model's default (medium); Aegis's per-model Thinking On/Off toggle sends
  # high/low per request.
  "gpt-oss-120b":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/gpt-oss-120b-heretic/kldzj_gpt-oss-120b-heretic-MXFP4_MOE/kldzj_gpt-oss-120b-heretic-MXFP4_MOE-00001-of-00002.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 65536 -fa on
      --jinja --no-webui
    filters:
      setParamsByID:
        "gpt-oss-120b-fast":
          reasoning_effort: low
    ttl: 3600

  # Huihui Qwen3.8-Flash-Next abliterated (177B-A6B, Swift IQ3_XXS 76GB).
  # Loaded WITH its vision projector (0.9GB): the same alias answers text and
  # image requests, so photo identification (/identify) can use the fastest
  # vision-capable model here without a second copy of the weights.
  "qwen3.8-flash-next":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/qwen3.8-flash-next-abliterated/swift-IQ3_XXS/Swift-Qwen3.8-Flash-Next-GSQ-RCO-IQ3_XXS-00001-of-00002.gguf"
      --mmproj "__MODELS_DIR__/qwen3.8-flash-next-abliterated/mmproj-Swift-Qwen3.8-Flash-Next-BF16.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 32768 -fa on
      --jinja --no-webui
    ttl: 600

  # Mistral Small 4 119B (A6B, Q4_K_M 73GB) -- natively permissive generalist.
  "mistral-small-4":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/mistral-small-4-119b/mistralai_Mistral-Small-4-119B-2603-Q4_K_M/mistralai_Mistral-Small-4-119B-2603-Q4_K_M-00001-of-00002.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 32768 -fa on
      --jinja --no-webui
    ttl: 600

  # MiniMax-M2.1 REAP 139B-A10B (Q4_K_M 84GB) -- agentic-coding model.
  "minimax-m2.1-reap":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/minimax-m2.1-reap-139b/MiniMax-M2.1-REAP-139B-A10B.Q4_K_M.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 32768 -fa on
      --jinja --no-webui
    ttl: 600

  # TheDrummer GLM-Steam 106B-A12B (GLM-4.5-Air finetune, Q4_K_M 73GB) --
  # the creative-writing / roleplay slot.
  "glm-steam-106b":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/glm-steam-106b/GLM-Steam-106B-A12B-v1b-Q4_K_M-00001-of-00002.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 32768 -fa on
      --jinja --no-webui
    ttl: 600

  # LOCAL IMAGE GENERATION -- Qwen-Image (diffusion) under stable-diffusion.cpp's
  # sd-server, which speaks OpenAI's /v1/images/generations. Text encoder runs on
  # CPU (one pass per prompt) so the 20.7GB Q8 diffusion model stays resident on
  # the GPU. (The Windows 4090 did ~25s per 512x512 image; expect slower on the
  # 8060S iGPU.) sd-server has no /health route, so health-check /v1/models
  # instead.
  "qwen-image":
    cmd: |
      "__ENGINE_DIR__/sdcpp/sd-server"
      --diffusion-model "__MODELS_DIR__/qwen-image/qwen-image-2512-Q8_0.gguf"
      --llm "__MODELS_DIR__/qwen-image/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf"
      --vae "__MODELS_DIR__/qwen-image/qwen_image_vae.safetensors"
      --backend clip=cpu
      --diffusion-fa --vae-tiling
      --lora-model-dir "__MODELS_DIR__/loras"
      --listen-port ${PORT}
    checkEndpoint: /v1/models
    ttl: 300

  # IMAGE EDITING -- Qwen-Image-Edit 2511 (img2img / inpaint / instruction edit)
  # under sd-server's /v1/images/edits. Reuses the SAME VAE + Qwen2.5-VL text
  # encoder as qwen-image. qwen_image_zero_cond_t=true is REQUIRED for the 2511
  # checkpoint (edit quality collapses without it, per sd.cpp docs).
  "qwen-image-edit":
    cmd: |
      "__ENGINE_DIR__/sdcpp/sd-server"
      --diffusion-model "__MODELS_DIR__/qwen-image-edit-2511-Q8_0.gguf"
      --llm "__MODELS_DIR__/qwen-image/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf"
      --vae "__MODELS_DIR__/qwen-image/qwen_image_vae.safetensors"
      --model-args qwen_image_zero_cond_t=true
      --cfg-scale 2.5 --flow-shift 3
      --backend clip=cpu
      --offload-to-cpu
      --diffusion-fa --vae-tiling
      --lora-model-dir "__MODELS_DIR__/loras"
      --listen-port ${PORT}
    checkEndpoint: /v1/models
    # Edits render slower than plain generation; keep a longer idle window so
    # the TTL can never fire while a legitimate render is still in flight.
    ttl: 600

  # Uncensored Qwen-Image merge (Phr00t Rapid, 21.75GB Q8) -- same qwen_image
  # architecture, reuses the stock VAE + Qwen2.5-VL text encoder. Rapid merges
  # are step-distilled: server defaults set to 8 steps / CFG 1.0.
  "qwen-image-rapid-nsfw":
    cmd: |
      "__ENGINE_DIR__/sdcpp/sd-server"
      --diffusion-model "__MODELS_DIR__/Qwen-Rapid-NSFW-v18.1_Q8_0.gguf"
      --llm "__MODELS_DIR__/qwen-image/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf"
      --vae "__MODELS_DIR__/qwen-image/qwen_image_vae.safetensors"
      --backend clip=cpu
      --diffusion-fa --vae-tiling
      --steps 8 --cfg-scale 1.0
      --lora-model-dir "__MODELS_DIR__/loras"
      --listen-port ${PORT}
    checkEndpoint: /v1/models
    ttl: 300

  # LOCAL VIDEO GENERATION -- Wan2.2 T2V A14B (dual high/low-noise experts).
  # Video is served on sd-server's native async API only: Aegis submits to
  # /upstream/wan2.2-t2v/sdcpp/v1/vid_gen and polls the returned job (the
  # /video slash command drives this). Flags per sd.cpp docs/wan.md. The umt5
  # text encoder runs on CPU; both diffusion experts (Q8_0, 15.4GB each --
  # the Q3_K_M pair was the measured cause of mangled hands) sit on the GPU.
  #
  # 4+4 steps assume the lightx2v Lightning LoRAs: Aegis splices
  # <lora:...low_noise:1><lora:|high_noise|...high_noise:1> into every native
  # Wan T2V prompt (src/video_generation.apply_wan_lightning) -- the distilled
  # schedule converges in 4 steps where the base model needed 20+, which is
  # both ~4x faster AND what fixes mushy hands/fingers at these step counts.
  # If models/loras/wan2.2_t2v_lightx2v_* are ever removed, raise steps back
  # to ~20/20.
  "wan2.2-t2v":
    cmd: |
      "__ENGINE_DIR__/sdcpp/sd-server"
      --diffusion-model "__MODELS_DIR__/Wan2.2-T2V-A14B-LowNoise-Q8_0.gguf"
      --high-noise-diffusion-model "__MODELS_DIR__/Wan2.2-T2V-A14B-HighNoise-Q8_0.gguf"
      --t5xxl "__MODELS_DIR__/video/umt5-xxl-encoder-Q8_0.gguf"
      --vae "__MODELS_DIR__/video/wan_2.1_vae.safetensors"
      --backend clip=cpu
      --sampling-method euler --steps 4 --cfg-scale 3.5
      --high-noise-sampling-method euler --high-noise-steps 4 --high-noise-cfg-scale 3.5
      --flow-shift 3.0
      --diffusion-fa --vae-tiling
      --lora-model-dir "__MODELS_DIR__/loras"
      --listen-port ${PORT}
    checkEndpoint: /v1/models
    ttl: 600

  # VOICE CLONING -- Chatterbox (Resemble AI, MIT) behind the same OpenAI
  # surface: llama-swap body-routes /v1/audio/speech on model "chatterbox-tts".
  # Voices are the user's cloned samples in data/voices (Settings -> TTS ->
  # My Voices); __MODELS_DIR__ is <repo>/models, so ../data/voices resolves
  # to the repo's data/voices. The server starts instantly (health passes)
  # and lazy-loads the 3.2GB model on the first request (weights come from the
  # Hugging Face cache, ~/.cache/huggingface/hub/models--ResembleAI--chatterbox;
  # they were fetched once on 2026-11-22 so this works with no internet).
  # setup-engine.sh gives the TTS venvs CPU torch by default, so on this box
  # it uses RAM, not GPU memory -- it lives in the `cpu` group below and never
  # evicts the chat model. (Built with --tts-rocm? Move it back to `gpu`.)
  # Which model speaks: server.py takes --model auto|standard|turbo. The default,
  # auto, is Chatterbox Turbo when its 4GB of files are already in the Hugging
  # Face cache (setup-engine.sh --tts-turbo fetches them) and the standard model
  # otherwise; add `--model standard` to the cmd below to stay with the original.
  "chatterbox-tts":
    cmd: |
      "__ENGINE_DIR__/chatterbox/venv/bin/python"
      "__ENGINE_DIR__/chatterbox/server.py"
      --host 127.0.0.1 --port ${PORT}
      --voices-dir "__MODELS_DIR__/../data/voices"
    checkEndpoint: /health
    ttl: 300

  # VOICE CLONING #2 -- Qwen3-TTS-12Hz-1.7B-Base (Apache-2.0) behind the same
  # OpenAI surface: llama-swap body-routes /v1/audio/speech on model
  # "qwen3-tts". Reads the SAME cloned samples in data/voices as Chatterbox;
  # an optional <name>.txt sidecar transcript upgrades a clone from
  # x-vector-only to full ICL quality. Starts instantly (health passes) and
  # lazy-loads the 1.7B on first request from --model-dir (the server's own
  # default is a Windows path and fails on Linux). CPU torch here as well, so
  # it sits in the `cpu` group with Chatterbox.
  "qwen3-tts":
    cmd: |
      "__ENGINE_DIR__/qwen3tts/venv/bin/python"
      "__ENGINE_DIR__/qwen3tts/server.py"
      --host 127.0.0.1 --port ${PORT}
      --voices-dir "__MODELS_DIR__/../data/voices"
      --model-dir "__MODELS_DIR__/audio/qwen3-tts-1.7b-base"
    checkEndpoint: /health
    ttl: 300

  # SPECIES ID -- BioCLIP 2 (Imageomics, MIT) scores a photo against ~867,000
  # taxa of the Tree of Life and returns the best species / genera / families.
  # Aegis's photo identification (/identify in chat, POST /api/reference/identify)
  # calls it through /upstream/species-id/classify and hands the candidates to
  # the vision model. CPU torch: ~10 s to load, ~0.4 s per photo, ~5GB of RAM
  # while resident (cpu group below, so it never evicts the chat model).
  # Model + text embeddings live in the Hugging Face cache
  # (models--imageomics--bioclip-2, datasets--imageomics--TreeOfLife-200M),
  # fetched once with `server.py --prefetch`; the server then loads offline.
  "species-id":
    cmd: |
      "__ENGINE_DIR__/speciesid/venv/bin/python"
      "__ENGINE_DIR__/speciesid/server.py"
      --host 127.0.0.1 --port ${PORT}
    checkEndpoint: /health
    ttl: 900

  # Vision-capable model for screenshot-grounded browser/computer control (Phase 4).
  # Qwen2.5-VL-3B (ggml-org GGUF + matching mmproj) -- a light (~3.3GB) multimodal
  # model that SEES page screenshots. Browser automation defaults to the reliable
  # a11y-snapshot mode; this adds screenshot vision as a failover for canvas/image
  # -only pages. (The gemma-4-12b + mmproj-F32 files in models/ are a mismatched
  # pair -- n_embd 3840 vs 2816 -- so they can't be used for vision.)
  "qwen-vl":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Qwen2.5-VL-3B-Instruct/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf"
      --mmproj "__MODELS_DIR__/Qwen2.5-VL-3B-Instruct/mmproj-Qwen2.5-VL-3B-Instruct-f16.gguf"
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 -c 126976 --no-webui
    ttl: 600

  # CPU-ONLY CHAT FALLBACK -- the escape hatch for GPU contention.
  #
  # While a render holds the GPU, llama-swap's answer to contention is
  # eviction: a chat request for any GPU model STOPS the render mid-job
  # (verified -- without the groups below, loading a second model unloads the
  # first). This entry runs the small 3B entirely on CPU: --device none
  # guarantees zero GPU allocation (backend-agnostic: it means the same thing
  # on Vulkan and ROCm builds), so chat and an in-flight render coexist on the
  # single iGPU. Aegis routes chat here automatically while a media job is in
  # flight. Text-only: no --mmproj.
  #
  # 32K context, not 8K: agent mode spends thousands of tokens on tool schemas
  # and the system prompt before the user's message even lands, and this model
  # stands in for a 45K-context coder model. KV lives in ordinary CPU pages
  # here, so the window costs no GTT. Keep gpu_guard.FALLBACK_CONTEXT in sync
  # with it.
  #
  # NB: comments must stay OUT of the `cmd: |` literal block below -- YAML does
  # not strip them there, so a '#' line would be handed to llama-server as
  # arguments and the model would fail to load.
  "chat-lite-cpu":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Qwen2.5-VL-3B-Instruct/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf"
      --host 127.0.0.1 --port ${PORT}
      --device none -ngl 0 -c 32768 -fa on --jinja --no-webui
    # Costs no GPU memory, so keep it warm far longer than the GPU models -- it
    # should be ready the moment a render starts, not cold-loading while the
    # user waits.
    ttl: 1800

  # CPU-ONLY CHAT FALLBACK, BIG EDITION -- the same abliterated 35B MoE the
  # user chats on normally (the Huihui Q5_K behind huihui-35b-opus-abliterated;
  # repointed 2026-11-22 because the HauhauCS Q4_K_P was never migrated), run
  # entirely on CPU threads (--device none: zero GPU allocation). A3B active params on the 16-core Zen 5 with LPDDR5X
  # decode at usable chat speed; replies during renders come from the same
  # brain as always instead of a 3B stand-in. ~25GB resident while warm --
  # affordable in 128GB. chat-lite-cpu above stays wired as the lightweight
  # option. Context matches gpu_guard.FALLBACK_CONTEXT (32K) like
  # chat-lite-cpu does.
  "chat-moe-cpu":
    cmd: |
      "__ENGINE_DIR__/llamacpp/llama-server"
      -m "__MODELS_DIR__/Huihui-Qwen3.6-35B-A3B-Claude-4.7-Opus-abliterated-Q5_K.gguf"
      --host 127.0.0.1 --port ${PORT}
      --device none -ngl 0 -c 32768 -fa on
      --chat-template-kwargs "{\"enable_thinking\":false}"
      --dry-multiplier 0.8
      --jinja --no-webui
    ttl: 1800


# -- Groups: who is allowed to share the GPU --
# Without this section every model lands in one implicit group where any load
# evicts whatever is already loaded -- including stopping an in-flight render.
# Verified on llama-swap v238: no groups => second load evicts the first;
# with these groups => the CPU model and a GPU model coexist in both orders.
groups:
  # Everything that wants the GPU. Each of these can claim most of the unified
  # memory budget, so: one at a time (swap), and it may evict its peers
  # (exclusive). This is exactly the behaviour these models already had --
  # nothing changes for them.
  gpu:
    swap: true
    exclusive: true
    members:
      - supergemma4-26b
      - qwen3.5-4b-uncensored
      - qwen3.6-35b-a3b
      - qwen3.6-35b-a3b-uncensored-q8
      - glm-4.7-flash-q4
      - glm-4.7-flash-uncensored
      - kimi-linear-48b
      - qwen3-coder-next-80b
      - qwopus-122b-uncensored
      - gpt-oss-120b
      - qwen3.8-flash-next
      - mistral-small-4
      - minimax-m2.1-reap
      - glm-steam-106b
      - qwen3.6-40b-deckard
      - qwen3.6-40b-deckard-vision
      - huihui-35b-opus-abliterated
      - qwen3.6-27b-fable-fus
      - qwen-vl
      - qwen-image
      - qwen-image-edit
      - qwen-image-rapid-nsfw
      - wan2.2-t2v
  # Everything that runs on CPU only: the chat fallbacks and the two TTS
  # servers (CPU torch on this box).
  #   exclusive: false -> loading one never evicts a GPU model or a render.
  #   persistent: true -> a GPU model loading never evicts it.
  # Both halves are required; either alone still breaks in one direction.
  # With TTS in the exclusive gpu group, every spoken reply unloaded the chat
  # model and the next message reloaded it -- seconds with a 25GB model,
  # 15-25s with the 63GB main model.
  cpu:
    swap: false
    exclusive: false
    persistent: true
    members:
      - chat-lite-cpu
      - chat-moe-cpu
      - chatterbox-tts
      - qwen3-tts
      - species-id
